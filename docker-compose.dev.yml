services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app                  # mount source for hot reload
      - /app/node_modules       # keep container's node_modules, not host's
    env_file:
      - .env                    # load all env vars from .env
    environment:
      - NODE_ENV=development
      - HOSTNAME=0.0.0.0
    command: pnpm run dev