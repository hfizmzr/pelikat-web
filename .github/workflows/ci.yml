name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Unit tests with coverage gate
        run: pnpm test --coverage

  docker:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: true
          build-args: |
            NEXT_PUBLIC_PWA_GATE=false
          tags: |
            ghcr.io/hfizmzr/pelikat-web:staging
            ghcr.io/hfizmzr/pelikat-web:sha-${{ github.sha }}

  deploy:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL_WEB }}
    steps:
      - name: Trigger Portainer stack redeploy
        if: env.WEBHOOK_URL != ''
        run: curl --fail --silent --show-error --max-time 30 -X POST "$WEBHOOK_URL"

      - name: Skip deploy (webhook not configured)
        if: env.WEBHOOK_URL == ''
        run: |
          echo 'skip: PORTAINER_WEBHOOK_URL_WEB secret not set yet'
          exit 0
