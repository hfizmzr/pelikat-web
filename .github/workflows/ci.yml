name: CI

permissions: { contents: read }

# Serialize runs per ref so an older run cannot finish last and overwrite
# the mutable :staging tag (or redeploy an obsolete image).
concurrency:
  group: "staging-${{ github.ref }}"
  cancel-in-progress: false

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Unit tests with coverage gate
        run: pnpm test --coverage

  docker:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read # Docker Hub (docker.io) is the registry now; GITHUB_TOKEN/push-packages scope no longer needed
    # job-level env so secrets can be checked with env.* conditions in steps
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Skip Docker Hub login (secrets not set yet)
        if: env.DOCKERHUB_USERNAME == '' || env.DOCKERHUB_TOKEN == ''
        run: |
          echo 'skip: Docker Hub secrets not set yet (DOCKERHUB_USERNAME / DOCKERHUB_TOKEN)'
          exit 0

      # Docker Hub images are public; Portainer only needs :staging (mutable, repulled)
      - name: Build and push staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: true
          build-args: |
            NEXT_PUBLIC_PWA_GATE=false
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL || '' }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || '' }}
          tags: |
            hfizmzr/pelikat-web:staging
            hfizmzr/pelikat-web:sha-${{ github.sha }}

  deploy:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL_WEB }}
    steps:
      - name: Trigger Portainer stack redeploy
        if: env.WEBHOOK_URL != ''
        run: curl --fail -s -o /dev/null --max-time 30 -X POST "$WEBHOOK_URL"

      - name: Skip deploy (webhook not configured)
        if: env.WEBHOOK_URL == ''
        run: |
          echo 'skip: PORTAINER_WEBHOOK_URL_WEB secret not set yet'
          exit 0
