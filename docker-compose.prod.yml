services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        - NEXT_PUBLIC_PWA_GATE=${NEXT_PUBLIC_PWA_GATE:-false}
    ports:
      - "3000:3000"
    env_file:
      - .env                    # load all env vars from .env
    environment:
      - NODE_ENV=production
    restart: unless-stopped