# Portainer stack UI env is the single source of truth (env_file is removed because
# Portainer Git stacks pull this compose from GitHub, where .env is gitignored).
services:
  web:
    image: docker.io/hfizmzr/pelikat-web:staging
    pull_policy: always # redeploy must fetch the newest :staging image even with an unchanged git ref
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # DJANGO_URL defaults to the internal Docker DNS name (both stacks join the
      # external pelikat-shared network); an explicit Portainer env value still wins.
      - DJANGO_URL=${DJANGO_URL:-http://api:8000}
      # hard-fail passthroughs so a misconfigured stack surfaces immediately
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?INTERNAL_API_KEY not set in Portainer stack env}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:?NEXT_PUBLIC_SUPABASE_URL not set in Portainer stack env}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:?NEXT_PUBLIC_SUPABASE_ANON_KEY not set in Portainer stack env}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY not set in Portainer stack env}
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-}
      - NEXT_PUBLIC_PAYMENT_PROVIDER=${NEXT_PUBLIC_PAYMENT_PROVIDER:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-}
      - NEXT_PUBLIC_TUNNEL_URL=${NEXT_PUBLIC_TUNNEL_URL:-}
      # next start does NOT log requests by default (only errors); Next's
      # internal `debug` package does when this env is set. Default is the
      # narrow verified namespace `next:router-server:main` — two short lines
      # per request (path + sanitized headers, no secrets). Portainer can
      # override; set to e.g. `off` or empty to silence. We deliberately do
      # NOT bounce Django-style semantics off DEBUG=1 (that would enable the
      # entire very-noisy next:* namespace).
      - DEBUG=${DEBUG:-next:router-server:main}
    restart: unless-stopped
    # 16GB VPS: per-container json-file retention ceiling — verbose staging
    # logs must not fill the disk (5×10MB rotated per container).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - pelikat-shared

# External network shared with the api staging stack in Portainer
# (create once on the host: docker network create pelikat-shared).
networks:
  pelikat-shared:
    external: true
    name: pelikat-shared
